[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EcoVis"
version = "0.1.0"
description = "A 3D OpenGL weather and geospatial visualization tool"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
    { name = "Maximilian Bennedik" },
    { name = "Moritz Dietrich" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PySDL3==0.9.11b1",
    "imgui-bundle==1.92.801",
    "PyOpenGL==3.1.10",
    "pyglm==2.8.3",

    "numpy==2.5.1",
    "scipy==1.18.0",
    "pandas==3.0.4",
    "tables==3.11.1",
    "matplotlib==3.11.1",
    "windrose==1.10.0",

    "rtree==1.4.1",
    "pyshp==3.1.4",

    "Pillow==12.3.0",
    "trimesh==4.12.2",
    "ijson==3.5.0",

    "herbie-data==2026.3.0",
    "openmeteo-requests==1.7.5",

    "aiohttp==3.14.1",
    "httpx[http2]==0.28.1",
    "h2==4.3.0",
    "requests-cache==1.3.3",
    "retry-requests==2.0.0",
]

[project.optional-dependencies]
# Optional build tools kept separate from runtime
dev = [
    # gebco_to_map_tiles.py
    "rasterio==1.5.0",

    # gebco_to_png.py
    "netcdf4==1.7.4",

    # om_file_reader.py
    "fsspec==2026.4.0",
    "Requests==2.34.2",
    "omfiles==1.2.0",

    # osm_extractor.py
    "osmium==4.3.1",
    "Shapely==2.1.2",

    # building executable
    "pyinstaller==6.20.0",
    "pyinstaller-hooks-contrib==2026.5",
]
